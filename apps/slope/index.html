<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Downhill</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, system-ui, sans-serif; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #07090a; color: #cfe8d8; touch-action: none; overscroll-behavior: none; }
      body { display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 16px); gap: 10px; }
      header { display: flex; justify-content: space-between; align-items: baseline; }
      h1 { font-size: 18px; margin: 0; }
      #fps, #log { font-size: 12px; color: #7c8a82; font-variant-numeric: tabular-nums; }
      #screen { width: 100%; aspect-ratio: 2 / 1; image-rendering: pixelated; background: #000; border-radius: 10px; box-shadow: 0 0 0 2px #1b2420; }
      #hud { font-size: 15px; font-weight: 600; min-height: 20px; font-variant-numeric: tabular-nums; }
      .pad { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
      .btn { display: flex; align-items: center; justify-content: center; border-radius: 22px; background: #141a17; border: 2px solid #26312c;
        font-size: 44px; font-weight: 800; color: #cfe8d8; touch-action: none; }
      .btn.on { background: #2f8a58; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .small { font-size: 14px; padding: 14px; border-radius: 14px; }
    </style>
  </head>
  <body>
    <header><h1>Downhill</h1><span id="fps"></span></header>
    <canvas id="screen"></canvas>
    <div id="hud"></div>
    <div class="pad">
      <div class="btn" id="left">◀</div>
      <div class="btn" id="right">▶</div>
    </div>
    <div class="row">
      <div class="btn small" id="pause">Pause</div>
      <div class="btn small" id="flip"></div>
    </div>
    <div id="log"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
